name: Archive retrospective hardening

on:
  push:
    branches: [fix/session-retrospective-hardening]

permissions:
  contents: write

jobs:
  archive:
    if: "!startsWith(github.event.head_commit.message, 'chore: archive retrospective hardening')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/session-retrospective-hardening
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - name: Mark archive task complete
        run: |
          node -e "const fs=require('node:fs'); const p='openspec/changes/session-retrospective-hardening/tasks.md'; let s=fs.readFileSync(p,'utf8'); s=s.replace('- [ ] Archive this change and re-run strict OpenSpec plus closure validation.','- [x] Archive this change and re-run strict OpenSpec plus closure validation.'); fs.writeFileSync(p,s)"
      - run: npx openspec archive session-retrospective-hardening --yes
      - run: npm run validate:spec
      - run: npm run test:openspec-closure
      - name: Commit archive
        run: |
          git add openspec
          git diff --cached --exit-code && exit 0 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: archive retrospective hardening"
          git push origin HEAD:fix/session-retrospective-hardening
