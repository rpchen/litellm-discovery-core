name: Release codebase-memory index

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Release version tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: codebase-memory-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out exact released version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      - name: Require an existing Release
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
      - name: Test index publication boundaries
        run: node --test scripts/codebase-memory.test.mjs
      - name: Install pinned runtime
        run: npm install --global codebase-memory-mcp@0.11.0
      - name: Generate immutable release index
        run: node scripts/codebase-memory.mjs build "$RELEASE_TAG"
      - name: Upload index assets to existing Release
        run: gh release upload "$RELEASE_TAG" .tmp/codebase-memory-release/codebase-memory.* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Download and verify published index
        run: node scripts/codebase-memory.mjs sync "$RELEASE_TAG"
