name: PR9 Core Finalize

on:
  push:
    branches: [feat/pr9-multi-endpoint-identity]
    paths: [.github/workflows/pr9-core-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR9 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/pr9-multi-endpoint-identity
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: npm ci
      - name: Re-run PR9 verification
        run: |
          npm run typecheck
          bun test
          npm run build:dist
          npm run test:package
          npm run validate:spec
          npm run test:openspec-closure
      - name: Mark verified tasks and archive through OpenSpec CLI
        run: |
          node - <<'NODE'
          const fs = require("node:fs")
          const path = "openspec/changes/pr9-multi-endpoint-identity/tasks.md"
          let text = fs.readFileSync(path, "utf8")
          text = text
            .replace("- [ ] Run Core typecheck, tests, build, isolated package consumer, strict OpenSpec and closure gates.", "- [x] Run Core typecheck, tests, build, isolated package consumer, strict OpenSpec and closure gates.")
            .replace("- [ ] Archive this change through OpenSpec CLI and re-run strict validation.", "- [x] Archive this change through OpenSpec CLI and re-run strict validation.")
          fs.writeFileSync(path, text)
          NODE
          npx openspec archive pr9-multi-endpoint-identity --yes
          npm run validate:spec
          npm run test:openspec-closure
      - name: Commit archived spec and self-remove
        run: |
          git rm .github/workflows/pr9-core-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(core): archive PR9 endpoint identity spec"
          git push origin HEAD:feat/pr9-multi-endpoint-identity
