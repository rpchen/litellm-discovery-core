name: OpenSpec archive maintenance

on:
  push:
    branches: [chore/openspec-closure-gate]

permissions:
  contents: write

jobs:
  archive:
    if: "!startsWith(github.event.head_commit.message, 'chore: archive completed OpenSpec changes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/openspec-closure-gate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Archive completed changes in implementation order
        run: |
          npx openspec archive add-discovery-core --yes
          npx openspec archive pr4-cross-repo-verification --yes
          npx openspec archive pr5-refresh-coordinator --yes
          npx openspec archive pr6-endpoint-snapshot --yes
          npx openspec archive pr7-diagnostics --yes
          npx openspec archive pr8-discovery-quality --yes
      - name: Fill canonical spec purposes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const purposes = {
            "discovery-core": "Defines the host-independent LiteLLM discovery contract, including response normalization, model grouping, protocol selection, models.dev enrichment, capability and price mapping, and neutral ModelSpec construction shared by consumer adapters.",
            "cross-repository-verification": "Defines how Core changes are verified against Pi and OpenCode consumers using immutable Core commit SHAs, compatibility workflows, provenance evidence, and post-merge checks before a shared change is considered closed.",
            "refresh-coordinator": "Defines the shared refresh coordination semantics for discovery, including singleflight, freshness caching, force refresh, retry backoff, last-known-good fallback, failure policy, reset behavior, and observable state.",
            "discovery-snapshot": "Defines endpoint-bound discovery snapshots, compatibility checks, schema and integrity validation, credential-safe endpoint fingerprints, restoration rules, and drift classification across discovery revisions.",
            "discovery-diagnostics": "Defines observational discovery diagnostics that explain model-info validity, models.dev matching, protocol decisions, field provenance, source boundaries, degraded enrichment, and cache state without changing discovery results.",
            "discovery-quality": "Defines conservative model identity matching and enrichment quality rules, reasoning and protocol capability resolution, distinct token-limit semantics, deterministic metadata precedence, unknown-model fallback, and conflict provenance."
          }
          for (const [name, purpose] of Object.entries(purposes)) {
            const path = `openspec/specs/${name}/spec.md`
            let content = fs.readFileSync(path, "utf8")
            content = content.replace(/## Purpose\n[\s\S]*?\n## Requirements/, `## Purpose\n${purpose}\n\n## Requirements`)
            fs.writeFileSync(path, content)
          }
          NODE
      - run: npm run validate:spec
      - name: Commit archive results
        run: |
          git add openspec
          git diff --cached --exit-code && exit 0 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: archive completed OpenSpec changes"
          git push origin HEAD:chore/openspec-closure-gate
