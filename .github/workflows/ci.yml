name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: bun test
      - name: Build ESM and declarations
        run: npm run build:dist
      - name: Verify isolated consumer import
        run: npm run test:package
      - name: Validate OpenSpec
        run: npm run validate:spec
      - name: Reject completed active OpenSpec changes
        run: npm run test:openspec-closure

  dispatch-consumers:
    name: Dispatch consumer compatibility checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch Pi and OpenCode checks
        if: env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DISPATCH_TOKEN }}
          CORE_SHA: ${{ github.sha }}
        run: |
          payload=$(printf '{"event_type":"litellm-discovery-core-updated","client_payload":{"core_repository":"https://github.com/rpchen/litellm-discovery-core.git","core_branch":"main","core_sha":"%s"}}' "$CORE_SHA")
          gh api repos/rpchen/pi-litellm-provider/dispatches --method POST --input - <<< "$payload"
          gh api repos/rpchen/opencode-litellm-provider/dispatches --method POST --input - <<< "$payload"
      - name: Report skipped dispatch
        if: env.DISPATCH_TOKEN == ''
        run: echo 'CROSS_REPO_DISPATCH_TOKEN is not configured; consumer dispatch skipped.' >> "$GITHUB_STEP_SUMMARY"
